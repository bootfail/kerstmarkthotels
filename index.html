<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kerstmarkthotels 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Sans+3:wght@400;500;600&display=swap">
<style>
/* ---------- tokens: licht ------------------------------------------- */
:root{
  --ground:#EBEFF5; --surface:#FFFFFF; --surface-2:#F5F7FB;
  --line:#D5DCE7; --line-soft:#E6EBF2;
  --ink:#141C2A; --ink-2:#3B4859; --muted:#5F6C7F;
  --accent:#A85C08; --accent-wash:#F7E9D4;
  --fir:#27604C; --wine:#8E2637;
  --bar:#C98A3C; --bar-track:#E2E7EF;
  --focus:#1D6FD1;
  --shadow:0 1px 2px rgba(20,28,42,.05), 0 10px 28px -18px rgba(20,28,42,.30);
  --r:10px;
}
/* ---------- tokens: donker ------------------------------------------ */
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0C131D; --surface:#141D29; --surface-2:#1B2533;
    --line:#2A3647; --line-soft:#1F2937;
    --ink:#E3EAF3; --ink-2:#B7C3D3; --muted:#8795A8;
    --accent:#E9A54E; --accent-wash:#3A2B16;
    --fir:#5FA98A; --wine:#D77384;
    --bar:#D79B4F; --bar-track:#222E3D;
    --focus:#6FB0F5;
    --shadow:0 1px 2px rgba(0,0,0,.30), 0 10px 28px -18px rgba(0,0,0,.70);
  }
}
:root[data-theme="dark"]{
  --ground:#0C131D; --surface:#141D29; --surface-2:#1B2533;
  --line:#2A3647; --line-soft:#1F2937;
  --ink:#E3EAF3; --ink-2:#B7C3D3; --muted:#8795A8;
  --accent:#E9A54E; --accent-wash:#3A2B16;
  --fir:#5FA98A; --wine:#D77384;
  --bar:#D79B4F; --bar-track:#222E3D;
  --focus:#6FB0F5;
  --shadow:0 1px 2px rgba(0,0,0,.30), 0 10px 28px -18px rgba(0,0,0,.70);
}

*{box-sizing:border-box}
html{background:var(--ground)}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font:400 16px/1.55 "Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1140px; margin:0 auto; padding-inline:16px; padding-block:0 56px}
a{color:inherit}
:where(button,input,select,a):focus-visible{outline:2px solid var(--focus); outline-offset:2px; border-radius:6px}

/* ---------- kop ------------------------------------------------------ */
header{
  border-bottom:1px solid var(--line);
  background:linear-gradient(180deg, var(--surface), var(--surface-2));
}
.head-in{max-width:1140px; margin:0 auto; padding:26px 16px 22px;
  display:flex; flex-wrap:wrap; gap:20px 32px; align-items:flex-end; justify-content:space-between}
.eyebrow{
  font:500 12px/1 "IBM Plex Mono", ui-monospace, monospace;
  letter-spacing:.10em; text-transform:uppercase; color:var(--accent); margin:0 0 9px;
}
h1{
  font:700 clamp(27px,4.4vw,38px)/1.08 "Bitter", Georgia, serif;
  margin:0; letter-spacing:-.015em; text-wrap:balance;
}
.sub{margin:8px 0 0; color:var(--muted); font-size:14.5px}
.stats{display:flex; gap:26px; flex-wrap:wrap}
.stat .k{font:500 11px/1 "IBM Plex Mono", monospace; letter-spacing:.09em;
  text-transform:uppercase; color:var(--muted)}
.stat .v{font:600 24px/1.2 "Bitter", Georgia, serif; margin-top:5px; font-variant-numeric:tabular-nums}
.stat .v small{font:400 13px/1 "Source Sans 3", sans-serif; color:var(--muted)}

/* ---------- secties -------------------------------------------------- */
section{margin-top:30px}
h2{font:600 15px/1.2 "Bitter", Georgia, serif; margin:0 0 3px; letter-spacing:-.005em}
.hint{margin:0 0 14px; color:var(--muted); font-size:13.5px}

/* ---------- staafjes per stad ---------------------------------------- */
.chart{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:14px 16px; box-shadow:var(--shadow);
  display:grid; gap:2px; max-height:330px; overflow-y:auto;
}
.crow{
  display:grid; grid-template-columns:118px 1fr 62px; align-items:center; gap:10px;
  padding:3px 6px; border:0; background:none; border-radius:6px;
  color:inherit; font:inherit; text-align:left; cursor:pointer; width:100%;
}
.crow:hover{background:var(--surface-2)}
.crow[aria-pressed="true"]{background:var(--accent-wash)}
.crow .nm{font-size:13.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.crow .tr{background:var(--bar-track); border-radius:3px; height:11px; overflow:hidden}
.crow .fl{background:var(--bar); height:100%; border-radius:3px; min-width:3px;
  transition:width .35s ease}
.crow .pv{font:500 13px/1 "IBM Plex Mono", monospace; text-align:right;
  font-variant-numeric:tabular-nums; color:var(--ink-2)}

/* ---------- filters -------------------------------------------------- */
.filters{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:16px; box-shadow:var(--shadow); display:grid; gap:15px;
}
.frow{display:flex; flex-wrap:wrap; gap:14px 22px; align-items:flex-end}
.fld{display:grid; gap:6px}
label,.lg{font:500 11px/1 "IBM Plex Mono", monospace; letter-spacing:.09em;
  text-transform:uppercase; color:var(--muted)}
input[type=search]{
  font:400 15px/1 "Source Sans 3", sans-serif; color:var(--ink);
  background:var(--surface-2); border:1px solid var(--line); border-radius:7px;
  padding:9px 11px; min-width:210px;
}
input[type=search]::placeholder{color:var(--muted)}
input[type=range]{width:190px; accent-color:var(--accent)}
.rngval{font:500 13px/1 "IBM Plex Mono", monospace; color:var(--ink-2);
  font-variant-numeric:tabular-nums}
.seg{display:flex; border:1px solid var(--line); border-radius:7px; overflow:hidden}
.seg button{
  font:500 13px/1 "Source Sans 3", sans-serif; color:var(--ink-2);
  background:var(--surface); border:0; border-right:1px solid var(--line);
  padding:9px 12px; cursor:pointer;
}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent); color:#fff}
.chips{display:flex; flex-wrap:wrap; gap:6px}
.chip{
  font:400 13px/1 "Source Sans 3", sans-serif; color:var(--ink-2);
  background:var(--surface-2); border:1px solid var(--line); border-radius:999px;
  padding:6px 11px; cursor:pointer;
}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:#fff}
.sw{display:flex; align-items:center; gap:8px; cursor:pointer;
  font:400 14px/1 "Source Sans 3", sans-serif; color:var(--ink-2); text-transform:none; letter-spacing:0}
.sw input{accent-color:var(--accent); width:16px; height:16px}
.reset{
  font:500 13px/1 "Source Sans 3", sans-serif; color:var(--accent);
  background:none; border:0; cursor:pointer; padding:6px 0; text-decoration:underline;
  text-underline-offset:3px;
}

/* ---------- tabel ---------------------------------------------------- */
.count{margin:16px 0 9px; color:var(--muted); font-size:13.5px}
.count b{color:var(--ink); font-weight:600}
.tw{border:1px solid var(--line); border-radius:var(--r); background:var(--surface);
  overflow-x:auto; box-shadow:var(--shadow)}
table{border-collapse:collapse; width:100%; min-width:660px}
thead th{
  position:sticky; top:0; z-index:1; background:var(--surface-2);
  font:500 11px/1 "IBM Plex Mono", monospace; letter-spacing:.08em; text-transform:uppercase;
  color:var(--muted); text-align:left; padding:0; border-bottom:1px solid var(--line);
  white-space:nowrap;
}
thead button{
  font:inherit; color:inherit; background:none; border:0; cursor:pointer;
  padding:11px 12px; width:100%; text-align:inherit; display:flex; gap:5px; align-items:center;
}
thead button:hover{color:var(--ink)}
thead .on{color:var(--accent)}
th.num button,td.num{text-align:right; justify-content:flex-end}
td{padding:10px 12px; border-bottom:1px solid var(--line-soft); font-size:14.5px;
  vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface-2)}
.rank{font:400 12px/1 "IBM Plex Mono", monospace; color:var(--muted);
  font-variant-numeric:tabular-nums}
.price{font:600 15px/1 "IBM Plex Mono", monospace; font-variant-numeric:tabular-nums}
.price.low{color:var(--fir)} .price.high{color:var(--wine)}
.tot{font:400 13.5px/1 "IBM Plex Mono", monospace; color:var(--muted);
  font-variant-numeric:tabular-nums}
.flexprice{font:500 14px/1 "IBM Plex Mono", monospace; color:var(--ink-2);
  font-variant-numeric:tabular-nums}
.op{font:400 11px/1 "IBM Plex Mono", monospace; color:var(--muted); margin-left:4px}
.check{font:600 14px/1 "IBM Plex Mono", monospace; font-variant-numeric:tabular-nums}
.check.ok{color:var(--fir)}
.check.mis{color:var(--wine)}
.hotel{display:flex; align-items:baseline; gap:7px; flex-wrap:wrap}
.hotel a{text-decoration:none; border-bottom:1px solid transparent}
.hotel a:hover{border-bottom-color:var(--accent); color:var(--accent)}
.stars{color:var(--accent); font-size:12px; letter-spacing:.5px; white-space:nowrap}
.tag{font:500 10px/1 "IBM Plex Mono", monospace; letter-spacing:.06em; text-transform:uppercase;
  color:var(--muted); border:1px solid var(--line); border-radius:4px; padding:3px 5px}
.score{font:500 13.5px/1 "IBM Plex Mono", monospace; font-variant-numeric:tabular-nums}
.score.good{color:var(--fir)} .score.weak{color:var(--muted)}
.rev{color:var(--muted); font-size:12px; font-variant-numeric:tabular-nums}
.when{font:400 13px/1 "IBM Plex Mono", monospace; color:var(--ink-2); white-space:nowrap}
.city{white-space:nowrap}
.more{display:block; width:100%; margin-top:14px; padding:11px;
  font:500 14px/1 "Source Sans 3", sans-serif; color:var(--ink-2);
  background:var(--surface); border:1px solid var(--line); border-radius:8px; cursor:pointer}
.more:hover{border-color:var(--accent); color:var(--accent)}
.empty{padding:38px 16px; text-align:center; color:var(--muted)}
footer{margin-top:34px; padding-top:16px; border-top:1px solid var(--line);
  color:var(--muted); font-size:13px}

@media (max-width:700px){
  .head-in{padding-bottom:18px}
  .stats{gap:18px}
  .crow{grid-template-columns:92px 1fr 54px}
  .hide-s{display:none}
  table{min-width:520px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header>
  <div class="head-in">
    <div>
      <p class="eyebrow" id="periode"></p>
      <h1>Kerstmarkthotels 2026</h1>
      <p class="sub" id="sub"></p>
    </div>
    <div class="stats" id="stats"></div>
  </div>
</header>

<div class="wrap">

  <section>
    <h2>Goedkoopste per stad</h2>
    <p class="hint">Laagste tarief per nacht binnen je huidige filters, inclusief belastingen
      en meestal niet-restitueerbaar. Klik een stad om er op te filteren.</p>
    <div class="chart" id="chart"></div>
  </section>

  <section>
    <h2>Filters</h2>
    <p class="hint">Alles werkt direct op de tabel hieronder.</p>
    <div class="filters">
      <div class="frow">
        <div class="fld">
          <label for="q">Hotelnaam</label>
          <input type="search" id="q" placeholder="zoek op naam…" autocomplete="off">
        </div>
        <div class="fld">
          <label for="prijs">Max per nacht</label>
          <div style="display:flex;align-items:center;gap:10px">
            <input type="range" id="prijs" min="0" max="100" value="100">
            <span class="rngval" id="prijsval"></span>
          </div>
        </div>
        <div class="fld">
          <span class="lg">Min. score</span>
          <div class="seg" id="score"></div>
        </div>
        <div class="fld">
          <span class="lg">Soort</span>
          <div class="seg" id="soort">
            <button type="button" data-soort="1" aria-pressed="true">alleen hotels</button>
            <button type="button" data-soort="0" aria-pressed="false">alles</button>
          </div>
        </div>
        <div class="fld">
          <span class="lg">Weergave</span>
          <label class="sw" for="uniek">
            <input type="checkbox" id="uniek" checked>
            één regel per hotel
          </label>
        </div>
        <button class="reset" id="reset" type="button">Alles wissen</button>
      </div>

      <div class="fld">
        <span class="lg">Weekend</span>
        <div class="chips" id="weekenden"></div>
      </div>

      <div class="fld">
        <span class="lg">Stad</span>
        <div class="chips" id="steden"></div>
      </div>
    </div>
  </section>

  <section>
    <p class="count" id="count"></p>
    <div class="tw">
      <table>
        <thead><tr id="thead"></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <button class="more" id="more" type="button" hidden></button>
  </section>

  <footer id="foot"></footer>
</div>

const EUR = new Intl.NumberFormat("nl-NL", {style:"currency", currency:DATA.valuta || "EUR",
  maximumFractionDigits:0});
const NUM = new Intl.NumberFormat("nl-NL");
const dm  = iso => {const [,m,d] = iso.split("-"); return `${+d}-${+m}`};

/* rij = [stadIdx, naam, perNacht, totaal, score, reviews, sterren, datumIdx,
          link, isRental, isHotel, flexPerNacht, flexTotaal] */
const R = {STAD:0, HOTEL:1, PN:2, TOT:3, SCORE:4, REV:5, STER:6, DAT:7, LINK:8,
           RENT:9, ECHT:10, FLEX:11, FLEXTOT:12, CHECK:13, BRON:14};
const METFLEX = !!DATA.metFlex;
const METCHECK = !!DATA.metCheck;
const rijen = DATA.rijen;
const prijzen = rijen.map(r => r[R.PN]).sort((a,b) => a-b);
const PMAX = Math.ceil(prijzen[prijzen.length-1]);
const PMIN = Math.floor(prijzen[0]);
const q1 = prijzen[Math.floor(prijzen.length*0.15)];
const q3 = prijzen[Math.floor(prijzen.length*0.85)];

const state = {q:"", steden:new Set(), weekenden:new Set(), maxPrijs:PMAX,
  minScore:0, alleenHotels:true, uniek:true, sortKey:R.PN, sortDir:1, limiet:150};

/* ---------- kop ------------------------------------------------------ */
const alleDatums = DATA.datums;
document.getElementById("periode").textContent =
  `Duitse kerstmarkten · ${dm(alleDatums[0][0])} t/m ${dm(DATA.eind)} ${DATA.jaar}`;
document.getElementById("sub").textContent =
  `${NUM.format(rijen.length)} tarieven uit ${DATA.steden.length} steden en ` +
  `${alleDatums.length} ${alleDatums.length === 1 ? "periode" : "periodes"}, ` +
  `voor ${DATA.personen} ${DATA.personen === 1 ? "persoon" : "personen"} · ` +
  `${DATA.nachten} ${DATA.nachten === 1 ? "nacht" : "nachten"}`;

/* De tegels volgen de filters: met "alleen hotels" aan is de laagste prijs
   een andere dan die van het hele bestand. */
function toonStats(lijst){
  const p = lijst.map(r => r[R.PN]).sort((a,b) => a-b);
  document.getElementById("stats").innerHTML = [
    ["Goedkoopst", p.length ? EUR.format(p[0]) : "—", "per nacht"],
    ["Mediaan", p.length ? EUR.format(p[Math.floor(p.length/2)]) : "—", "per nacht"],
    ["Gescand op", DATA.gescand, ""],
  ].map(([k,v,s]) => `<div class="stat"><div class="k">${k}</div>
    <div class="v">${v}${s ? ` <small>${s}</small>` : ""}</div></div>`).join("");
}

document.getElementById("foot").innerHTML =
  (METFLEX
    ? "<b>Vanaf</b> is het laagste tarief dat Google Hotels kent en is vrijwel altijd " +
      "niet-restitueerbaar. <b>Flexibel</b> komt uit een tweede zoekopdracht waarin alleen " +
      "tarieven met gratis annulering zijn meegenomen; het percentage erachter is de opslag " +
      "die je voor die annuleerbaarheid betaalt. Een streepje betekent dat er voor die " +
      "datums geen annuleerbaar tarief te vinden was. "
    : "<b>Wat je hier ziet:</b> het laagste tarief dat Google Hotels kent, en dat is " +
      "vrijwel altijd niet-restitueerbaar. Reken voor een annuleerbaar tarief op 30 à 40% meer. ") +
  (METCHECK
    ? "<b>Gecheckt</b> is voor de goedkoopste hotels het laagste tarief dat daadwerkelijk " +
      "bij een aanbieder staat, met die aanbieder erachter. Groen betekent dat de vanaf-prijs " +
      "klopt, rood dat er in werkelijkheid meer betaald moet worden. Een streepje betekent " +
      "alleen dat dit hotel niet is nagekeken, niet dat er iets mis is. "
    : "") +
  "Alle bedragen zijn inclusief belastingen en toeslagen, per nacht tenzij anders vermeld. " +
  "Je boekt bij de aanbieder, waar het tarief kan afwijken. Openingsdata van de markten " +
  "verschillen per stad; check de stadssite voordat je boekt.";

/* Staat er niets anders dan hotels in, dan valt er ook niets te schakelen. */
if(DATA.alleenHotels){
  document.getElementById("soort").closest(".fld").hidden = true;
  state.alleenHotels = false;
}

/* ---------- filterelementen ------------------------------------------ */
const elPrijs = document.getElementById("prijs");
elPrijs.min = PMIN; elPrijs.max = PMAX; elPrijs.value = PMAX;

const elSteden = document.getElementById("steden");
elSteden.innerHTML = DATA.steden.map((s,i) =>
  `<button class="chip" type="button" data-stad="${i}" aria-pressed="false">${s}</button>`).join("");

const elWeek = document.getElementById("weekenden");
elWeek.innerHTML = alleDatums.map((d,i) =>
  `<button class="chip" type="button" data-week="${i}" aria-pressed="false">${dm(d[0])} → ${dm(d[1])}</button>`).join("");

document.getElementById("score").innerHTML = [[0,"alle"],[3.5,"3,5+"],[4,"4,0+"],[4.5,"4,5+"]]
  .map(([v,l]) => `<button type="button" data-score="${v}" aria-pressed="${v===0}">${l}</button>`).join("");

const KOLOM = [
  {k:R.PN,    t:"vanaf",   num:true},
  {k:R.TOT,   t:"totaal",  num:true, cls:"hide-s"},
  ...(METFLEX ? [{k:R.FLEX, t:"flexibel", num:true}] : []),
  ...(METCHECK ? [{k:R.CHECK, t:"gecheckt", num:true}] : []),
  {k:R.STAD,  t:"stad"},
  {k:R.HOTEL, t:"hotel"},
  {k:R.SCORE, t:"score",   num:true},
  {k:R.DAT,   t:"datum"},
];
document.getElementById("thead").innerHTML =
  `<th style="width:44px"></th>` + KOLOM.map(c =>
    `<th class="${c.num ? "num " : ""}${c.cls || ""}">
       <button type="button" data-sort="${c.k}"><span>${c.t}</span><span data-arrow="${c.k}"></span></button>
     </th>`).join("");

/* ---------- filteren ------------------------------------------------- */
function pas(r, negeerStad){
  if(state.alleenHotels && !r[R.ECHT]) return false;
  if(!negeerStad && state.steden.size && !state.steden.has(r[R.STAD])) return false;
  if(state.weekenden.size && !state.weekenden.has(r[R.DAT])) return false;
  if(r[R.PN] > state.maxPrijs) return false;
  if(state.minScore && !(r[R.SCORE] >= state.minScore)) return false;
  if(state.q && !r[R.HOTEL].toLowerCase().includes(state.q)) return false;
  return true;
}

function uniekPerHotel(lijst){
  const best = new Map();
  for(const r of lijst){
    const sleutel = r[R.STAD] + "|" + r[R.HOTEL];
    const h = best.get(sleutel);
    if(!h || r[R.PN] < h[R.PN]) best.set(sleutel, r);
  }
  return [...best.values()];
}

/* ---------- renderen ------------------------------------------------- */
function render(){
  document.getElementById("prijsval").textContent =
    state.maxPrijs >= PMAX ? "geen max" : `≤ ${EUR.format(state.maxPrijs)}`;

  /* staafjes: alle filters behalve de stadsselectie, anders valt de grafiek leeg */
  const voorChart = rijen.filter(r => pas(r, true));
  const laagste = new Map();
  for(const r of voorChart){
    const h = laagste.get(r[R.STAD]);
    if(h === undefined || r[R.PN] < h) laagste.set(r[R.STAD], r[R.PN]);
  }
  const chartRijen = [...laagste.entries()].sort((a,b) => a[1]-b[1]);
  const top = chartRijen.length ? chartRijen[chartRijen.length-1][1] : 1;
  document.getElementById("chart").innerHTML = chartRijen.length
    ? chartRijen.map(([i,p]) => `
      <button class="crow" type="button" data-stad="${i}"
              aria-pressed="${state.steden.has(i)}" title="${DATA.markten[i] || ""}">
        <span class="nm">${DATA.steden[i]}</span>
        <span class="tr"><span class="fl" style="width:${Math.max(3, p/top*100)}%"></span></span>
        <span class="pv">${EUR.format(p)}</span>
      </button>`).join("")
    : `<p class="empty">Geen steden binnen deze filters.</p>`;

  let lijst = rijen.filter(r => pas(r, false));
  if(state.uniek) lijst = uniekPerHotel(lijst);
  toonStats(lijst);

  const d = state.sortDir, k = state.sortKey;
  lijst.sort((a,b) => {
    let x = a[k], y = b[k];
    if(k === R.STAD){ x = DATA.steden[x]; y = DATA.steden[y]; }
    if(k === R.DAT){ x = alleDatums[x][0]; y = alleDatums[y][0]; }
    if(k === R.SCORE || k === R.FLEX || k === R.CHECK){
      x = x ?? Infinity*d; y = y ?? Infinity*d;
    }
    if(typeof x === "string") return x.localeCompare(y, "nl") * d;
    return (x - y) * d;
  });

  document.querySelectorAll("[data-arrow]").forEach(el => {
    const mijn = +el.dataset.arrow === k;
    el.textContent = mijn ? (d === 1 ? "↑" : "↓") : "";
    el.closest("button").classList.toggle("on", mijn);
  });

  const zichtbaar = lijst.slice(0, state.limiet);
  document.getElementById("count").innerHTML = lijst.length
    ? `<b>${NUM.format(lijst.length)}</b> ${lijst.length === 1 ? "resultaat" : "resultaten"}` +
      (state.uniek ? " · goedkoopste datum per hotel" : " · elk weekend apart")
    : "Geen resultaten";

  document.getElementById("tbody").innerHTML = zichtbaar.length
    ? zichtbaar.map((r,i) => {
        const pn = r[R.PN];
        const kl = pn <= q1 ? "low" : pn >= q3 ? "high" : "";
        const sc = r[R.SCORE];
        const dt = alleDatums[r[R.DAT]];
        const naam = r[R.LINK]
          ? `<a href="${r[R.LINK]}" target="_blank" rel="noopener">${r[R.HOTEL]}</a>`
          : r[R.HOTEL];
        return `<tr>
          <td class="rank">${i+1}</td>
          <td class="num"><span class="price ${kl}">${EUR.format(pn)}</span></td>
          <td class="num hide-s"><span class="tot">${EUR.format(r[R.TOT])}</span></td>
          ${METFLEX ? `<td class="num">${r[R.FLEX]
            ? `<span class="flexprice">${EUR.format(r[R.FLEX])}</span>
               <span class="op">+${Math.round((r[R.FLEX]/pn - 1) * 100)}%</span>`
            : `<span class="rev" title="Geen annuleerbaar tarief gevonden">—</span>`}</td>` : ""}
          ${METCHECK ? `<td class="num">${r[R.CHECK]
            ? `<span class="check ${r[R.CHECK] > pn * 1.02 ? "mis" : "ok"}"
                     title="Laagste tarief bij ${r[R.BRON] || "?"}">${EUR.format(r[R.CHECK])}</span>
               <span class="op">${r[R.BRON] || ""}</span>`
            : `<span class="rev" title="Niet gecontroleerd">—</span>`}</td>` : ""}
          <td class="city">${DATA.steden[r[R.STAD]]}</td>
          <td><div class="hotel">${naam}
            ${r[R.STER] ? `<span class="stars">${"★".repeat(r[R.STER])}</span>` : ""}
            ${!r[R.ECHT] ? `<span class="tag">geen hotel</span>` : ""}
            ${r[R.RENT] ? `<span class="tag">woning</span>` : ""}</div></td>
          <td class="num">${sc
            ? `<span class="score ${sc >= 4.2 ? "good" : sc < 3.5 ? "weak" : ""}">${sc.toFixed(1)}</span>
               <span class="rev hide-s"> (${NUM.format(r[R.REV] || 0)})</span>`
            : `<span class="rev">—</span>`}</td>
          <td class="when">${dm(dt[0])} → ${dm(dt[1])}</td>
        </tr>`;
      }).join("")
    : `<tr><td colspan="${KOLOM.length + 1}" class="empty">Niets gevonden. Verruim je filters of wis ze.</td></tr>`;

  const meer = document.getElementById("more");
  meer.hidden = lijst.length <= state.limiet;
  meer.textContent = `Toon de volgende ${Math.min(150, lijst.length - state.limiet)} ` +
    `van ${NUM.format(lijst.length)}`;
}

/* ---------- interactie ----------------------------------------------- */
function herstelLimiet(){ state.limiet = 150 }

document.getElementById("q").addEventListener("input", e => {
  state.q = e.target.value.trim().toLowerCase(); herstelLimiet(); render();
});
elPrijs.addEventListener("input", e => {
  state.maxPrijs = +e.target.value; herstelLimiet(); render();
});
document.getElementById("uniek").addEventListener("change", e => {
  state.uniek = e.target.checked; herstelLimiet(); render();
});
document.getElementById("score").addEventListener("click", e => {
  const b = e.target.closest("button"); if(!b) return;
  state.minScore = +b.dataset.score;
  [...e.currentTarget.children].forEach(x => x.setAttribute("aria-pressed", x === b));
  herstelLimiet(); render();
});
document.getElementById("soort").addEventListener("click", e => {
  const b = e.target.closest("button"); if(!b) return;
  state.alleenHotels = b.dataset.soort === "1";
  [...e.currentTarget.children].forEach(x => x.setAttribute("aria-pressed", x === b));
  herstelLimiet(); render();
});

function wisselStad(i){
  state.steden.has(i) ? state.steden.delete(i) : state.steden.add(i);
  document.querySelectorAll(`.chip[data-stad="${i}"]`)
    .forEach(c => c.setAttribute("aria-pressed", state.steden.has(i)));
  herstelLimiet(); render();
}
elSteden.addEventListener("click", e => {
  const b = e.target.closest("[data-stad]"); if(b) wisselStad(+b.dataset.stad);
});
document.getElementById("chart").addEventListener("click", e => {
  const b = e.target.closest("[data-stad]"); if(b) wisselStad(+b.dataset.stad);
});
elWeek.addEventListener("click", e => {
  const b = e.target.closest("[data-week]"); if(!b) return;
  const i = +b.dataset.week;
  state.weekenden.has(i) ? state.weekenden.delete(i) : state.weekenden.add(i);
  b.setAttribute("aria-pressed", state.weekenden.has(i));
  herstelLimiet(); render();
});
document.getElementById("thead").addEventListener("click", e => {
  const b = e.target.closest("[data-sort]"); if(!b) return;
  const k = +b.dataset.sort;
  if(state.sortKey === k) state.sortDir *= -1;
  else { state.sortKey = k; state.sortDir = (k === R.SCORE) ? -1 : 1; }
  herstelLimiet(); render();
});
document.getElementById("more").addEventListener("click", () => {
  state.limiet += 150; render();
});
document.getElementById("reset").addEventListener("click", () => {
  state.q = ""; state.steden.clear(); state.weekenden.clear();
  state.maxPrijs = PMAX; state.minScore = 0; state.uniek = true;
  state.alleenHotels = true;
  state.sortKey = R.PN; state.sortDir = 1; herstelLimiet();
  document.getElementById("q").value = "";
  elPrijs.value = PMAX;
  document.getElementById("uniek").checked = true;
  document.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", "false"));
  [...document.getElementById("score").children]
    .forEach(x => x.setAttribute("aria-pressed", x.dataset.score === "0"));
  [...document.getElementById("soort").children]
    .forEach(x => x.setAttribute("aria-pressed", x.dataset.soort === "1"));
  render();
});

render();
</script>
</body>
</html>
